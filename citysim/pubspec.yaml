name: citysim
description: "Standalone parcel-world settlement game prototype (synthetic data, isolated from the Accountable finance app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/buggy_studio/
    - assets/buggy_studio/Buildings/
    - assets/buggy_studio/Characters/
    - assets/buggy_studio/Props/
    - assets/buggy_studio/Roads and Grounds/
    - assets/buggy_studio/Vehicles/
